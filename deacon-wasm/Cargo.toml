[package]
name = "deacon-wasm"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deacon = { path = "..", default-features = false }
wasm-bindgen = "0.2.113"
js-sys = "0.3"
flate2 = { version = "1.1", features = ["zlib-rs"] }
sirocco = "0.3"
console_error_panic_hook = "0.1"
memchr = "2.7"
